sudo: required
services:
  - docker
env:
  global:
    - SHA=$(git rev-parse HEAD)
    - CLOUDSDK_CORE_DISABLE_PROMPTS=1
    # to avoid having to enter yes when installing the gcloud sdk
before_install:
  # to install the google cloud sdk to can connect to the gcloud container registry
  - openssl aes-256-cbc -K $encrypted_9f3b5599b056_key -iv $encrypted_9f3b5599b056_iv -in service-account.json.enc -out service-account.json -d
  - curl https://sdk.cloud.google.com | bash > /dev/null;
  - source $HOME/google-cloud-sdk/path.bash.inc;
  - gcloud components update kubectl
  - gcloud auth activate-service-account --key-file service-account.json
  - gcloud config set project multi-k8s-510619
  - gcloud config set compute/zone us-central1-a
  - gcloud container clusters get-credentials multi-cluster
  - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  - docker build -t ebaash/multi-client:latest -t ebaash/multi-client:$SHA -f ./client/Dockerfile.dev ./client

script:
  - docker run -e CI=true stephengrider/multi-client npm test

# we stell need to create the secret service by imperetive command for the pgpassword
# so we do this using the shel in the Google Cloud console
# we run the gcloud command to connect to the cluster and then run the kubectl command to create the secret service
# we run the following command to create the secret service for the pgpassword
# kubectl create secret generic pgpassword --from-literal PGPASSWORD=<your password>
deploy:
  provider: script
  script: bash ./deploy.sh
  on:
    branch: main

