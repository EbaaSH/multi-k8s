# RBAC is a way to control access to resources in Kubernetes. It allows you to define roles and permissions for users and groups, and then assign those roles to specific resources. This way, you can control who has access to what in your Kubernetes cluster.
# we have this types of roles in the RBAC:
# user accounts, service accounts,  role bindings, cluster role bindings
# user accounts: give access to the cluster to a specific user, and can be used to control access to resources in the cluster.
# service accounts: give access to the cluster to a specific service, and can be used to control access to resources in the cluster.
# role bindings: give access to a specific user or service to the all namespaces in the cluster, and can be used to control access to resources in the cluster.
# cluster role bindings: give access to a specific user or service to the all namespaces in the cluster, and can be used to control access to resources in the cluster.

