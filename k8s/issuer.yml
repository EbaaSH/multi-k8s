# after installing cert Manager in the cloud server
# we configure the issuer service
# where: it is an Object tellling cert manager where to get the certificate from
# and for our example we will use [litsencrypt]
apiVersion: certmanager.k8s.io/v1alpha1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: "ebaashkair248@gmail.com"
    privateKeySecretRef:
      name: letsencrypt-prod
    http01: {}
